<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Three.js Instanced Grid Demo</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: #111;
			}

			canvas {
				display: block;
			}
		</style>
	</head>
	<body>
		<script type="module">
			import * as THREE from "https://esm.sh/three@0.172.0";
			import { OrbitControls } from "https://esm.sh/three@0.172.0/examples/jsm/controls/OrbitControls.js";
			import Stats from "https://esm.sh/three@0.172.0/examples/jsm/libs/stats.module.js";

			// ===== 基础场景 =====
			const scene = new THREE.Scene();
			scene.background = new THREE.Color(0xffffff);

			const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
			camera.position.set(10, 16, 14);
			camera.lookAt(0, 0, 0);

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
			// 开启阴影贴图，让场景物体可投射/接收阴影
			renderer.shadowMap.enabled = true;
			renderer.shadowMap.type = THREE.PCFSoftShadowMap;
			document.body.appendChild(renderer.domElement);

			// ===== Stats 帧率面板 =====
			const stats = new Stats();
			stats.showPanel(0);
			document.body.appendChild(stats.dom);

			// ===== 鼠标轨道控制器 =====
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.enableDamping = true;
			controls.dampingFactor = 0.08;
			controls.target.set(0, 0, 0);
			controls.update();

			// ===== 灯光 =====
			scene.add(new THREE.AmbientLight(0xffffff, 0.7));
			const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
			dirLight.position.set(12, 20, 8);
			// 平行光开启阴影，并设置阴影相机范围
			dirLight.castShadow = true;
			dirLight.shadow.mapSize.set(2048, 2048);
			dirLight.shadow.camera.near = 1;
			dirLight.shadow.camera.far = 80;
			dirLight.shadow.camera.left = -20;
			dirLight.shadow.camera.right = 20;
			dirLight.shadow.camera.top = 20;
			dirLight.shadow.camera.bottom = -20;
			scene.add(dirLight);

			// ===== 参数 =====
			const GRID_SIZE = 16;
			const INSTANCE_COUNT = GRID_SIZE * GRID_SIZE;
			const CUBE_SIZE = 0.92;
			const CUBE_HEIGHT = 0.58;
			const NORMAL_Y = 0;
			const DOWN_Y = 0;
			const HOVER_ALPHA = 0.85;
			const NORMAL_ALPHA = 1.0;
			const HOVER_COLOR = new THREE.Color(0xff4d4f);

			// ===== 使用实例化绘制格子 =====
			const boxGeo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_HEIGHT, CUBE_SIZE);
			const boxMat = new THREE.MeshStandardMaterial({
				color: 0x66aaff,
				roughness: 0.45,
				metalness: 0.05,
				transparent: true,
			});

			// 给材质注入实例级透明度（每个实例独立 alpha）
			boxMat.onBeforeCompile = (shader) => {
				shader.vertexShader = shader.vertexShader
					.replace(
						"#include <common>",
						`
            #include <common>
            attribute float instanceAlpha;
            varying float vInstanceAlpha;
            `,
					)
					.replace(
						"#include <begin_vertex>",
						`
            #include <begin_vertex>
            vInstanceAlpha = instanceAlpha;
            `,
					);

				shader.fragmentShader = shader.fragmentShader
					.replace(
						"#include <common>",
						`
            #include <common>
            varying float vInstanceAlpha;
            `,
					)
					.replace(
						"#include <dithering_fragment>",
						`
            gl_FragColor.a *= vInstanceAlpha;
            #include <dithering_fragment>
            `,
					);
			};

			const grid = new THREE.InstancedMesh(boxGeo, boxMat, INSTANCE_COUNT);
			grid.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
			grid.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(INSTANCE_COUNT * 3), 3);
			grid.castShadow = true;
			grid.receiveShadow = true;

			// 每个实例一个 alpha，避免“一个实例透明导致全体透明”
			const alphaArray = new Float32Array(INSTANCE_COUNT);
			alphaArray.fill(NORMAL_ALPHA);
			boxGeo.setAttribute("instanceAlpha", new THREE.InstancedBufferAttribute(alphaArray, 1));

			// 缓存每个实例的基础位置，方便选中时做上下移动
			const basePositions = new Array(INSTANCE_COUNT);
			// 缓存每个实例的原始颜色，方便取消选中后恢复
			const baseColors = new Array(INSTANCE_COUNT);
			const dummy = new THREE.Object3D();
			let index = 0;
			const offset = (GRID_SIZE - 1) / 2;

			for (let z = 0; z < GRID_SIZE; z++) {
				for (let x = 0; x < GRID_SIZE; x++) {
					const px = x - offset;
					const pz = z - offset;
					basePositions[index] = new THREE.Vector3(px, NORMAL_Y, pz);
					dummy.position.copy(basePositions[index]);
					dummy.updateMatrix();
					grid.setMatrixAt(index, dummy.matrix);

					// 给每个格子设置随机颜色（实例级颜色，不共享）
					const randomColor = new THREE.Color().setHSL(Math.random(), 0.62, 0.56);
					baseColors[index] = randomColor.clone();
					grid.setColorAt(index, randomColor);
					index++;
				}
			}

			grid.instanceColor.needsUpdate = true;

			scene.add(grid);

			// ===== 点击后在格子上方添加“不会消失”的圆环 =====
			const ringGeometry = new THREE.TorusGeometry(0.56, 0.12, 28, 64);
			const ringMaterial = new THREE.MeshStandardMaterial({
				color: 0xffcc44,
				emissive: 0x332200,
				roughness: 0.3,
				metalness: 0.18,
			});
			const ringHeight = CUBE_HEIGHT * 1.8;
			const placedRingMap = new Map();

			// ===== 射线拾取 =====
			const raycaster = new THREE.Raycaster();
			const mouse = new THREE.Vector2();
			let hoveredId = -1;

			function setInstanceState(id, isHovered) {
				if (id < 0 || id >= INSTANCE_COUNT) return;

				// 更新实例透明度
				alphaArray[id] = isHovered ? HOVER_ALPHA : NORMAL_ALPHA;
				boxGeo.attributes.instanceAlpha.needsUpdate = true;

				// 更新实例颜色：选中时半透明红色，取消选中时恢复原随机色
				grid.setColorAt(id, isHovered ? HOVER_COLOR : baseColors[id]);
				grid.instanceColor.needsUpdate = true;

				// 更新实例上下位置
				dummy.position.copy(basePositions[id]);
				dummy.position.y += isHovered ? DOWN_Y : 0;
				dummy.updateMatrix();
				grid.setMatrixAt(id, dummy.matrix);
				grid.instanceMatrix.needsUpdate = true;
			}

			// 鼠标点击某个格子后，添加一个常驻圆环
			function updateSelect(clientX, clientY) {
				mouse.x = (clientX / window.innerWidth) * 2 - 1;
				mouse.y = -(clientY / window.innerHeight) * 2 + 1;
				raycaster.setFromCamera(mouse, camera);

				const hit = raycaster.intersectObject(grid, false);
				if (hit.length === 0) return;

				const instanceId = hit[0].instanceId;
				if (instanceId === undefined || instanceId < 0) return;
				if (placedRingMap.has(instanceId)) return;

				const pos = basePositions[instanceId];
				const ring = new THREE.Mesh(ringGeometry, ringMaterial.clone());
				ring.position.set(pos.x, ringHeight, pos.z);
				ring.rotation.x = Math.PI / 2;
				ring.castShadow = true;
				ring.receiveShadow = true;
				// 给每个圆环一个独立旋转速度，形成自由旋转效果
				ring.userData.spinY = 0.6 + Math.random() * 2.0;
				ring.userData.spinZ = 0.4 + Math.random() * 1.5;
				scene.add(ring);
				placedRingMap.set(instanceId, ring);
			}

			function updateHover(clientX, clientY) {
				mouse.x = (clientX / window.innerWidth) * 2 - 1;
				mouse.y = -(clientY / window.innerHeight) * 2 + 1;
				raycaster.setFromCamera(mouse, camera);

				const hit = raycaster.intersectObject(grid, false);
				const nextId = hit.length > 0 ? hit[0].instanceId : -1;

				if (nextId === hoveredId) return;

				if (hoveredId !== -1) {
					setInstanceState(hoveredId, false);
				}

				hoveredId = nextId;

				if (hoveredId !== -1) {
					setInstanceState(hoveredId, true);
				}

			}

			// 鼠标移出画布时，恢复高亮状态
			renderer.domElement.addEventListener("pointerleave", () => {
				if (hoveredId !== -1) {
					setInstanceState(hoveredId, false);
					hoveredId = -1;
				}
			});

			renderer.domElement.addEventListener("pointermove", (event) => {
				updateHover(event.clientX, event.clientY);
			});

			renderer.domElement.addEventListener("pointerdown", (event) => {
				updateSelect(event.clientX, event.clientY);
			});

			// ===== 自适应 =====
			window.addEventListener("resize", () => {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
			});

			// ===== 动画循环 =====
			const clock = new THREE.Clock();
			function tick() {
				stats.begin();
				clock.getDelta();
				const t = clock.elapsedTime;

				// 所有已放置圆环持续自由旋转，且不消失
				placedRingMap.forEach((ring) => {
					ring.rotation.y += ring.userData.spinY * 0.01;
					ring.rotation.z += ring.userData.spinZ * 0.01;
				});
				controls.update();
				renderer.render(scene, camera);
				stats.end();
				requestAnimationFrame(tick);
			}
			tick();
		</script>
	</body>
</html>
